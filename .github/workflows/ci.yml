---
name: CI Orchestrator

on: 
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      skip_tests:
        description: 'Skip tests (use with caution)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  security-events: write
  checks: write
  actions: read

env:
  PYTHON_VERSION: "3.11"
  PIP_CACHE_DIR: ~/.cache/pip

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python with cache
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build package
        run: |
          echo "🔨 Building package artifacts..."
          python -m build
          echo "✅ Package build completed"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 7

      - name: Build Summary
        if: always()
        run: |
          echo "### 🔨 Build Results" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Package artifacts built successfully" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 Artifacts uploaded for downstream jobs" >> $GITHUB_STEP_SUMMARY

  # —— Parallel lanes (all need only build) ——
  security:
    name: Security Scan
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python with cache
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install security tools
        run: |
          pip install bandit semgrep "safety>=3,<4"

      - name: Bandit (SARIF)
        run: |
          echo "🔍 Running Bandit security scan..."
          bandit -r src -f sarif -o bandit.sarif || true

      - name: Semgrep (SARIF)
        run: |
          echo "🔍 Running Semgrep security scan..."
          semgrep ci --config p/ci --sarif --output semgrep.sarif || true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .
          category: python-security

      - name: Safety (JSON file)
        run: |
          echo "🔍 Running Safety vulnerability scan..."
          safety scan --json --output safety-report.json || true
          safety scan --output text || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit.sarif
            semgrep.sarif
            safety-report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Security Summary
        if: always()
        run: |
          echo "### 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
          
          if [ -f bandit.sarif ]; then
            BANDIT_ISSUES=$(python3 -c "import json; data=json.load(open('bandit.sarif')); print(len(data.get('runs', [{}])[0].get('results', [])))" 2>/dev/null || echo "0")
            echo "- 🔍 **Bandit**: $BANDIT_ISSUES security issues found" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 🔍 **Bandit**: No SARIF report generated" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f semgrep.sarif ]; then
            SEMGREP_ISSUES=$(python3 -c "import json; data=json.load(open('semgrep.sarif')); print(len(data.get('runs', [{}])[0].get('results', [])))" 2>/dev/null || echo "0")
            echo "- 🔍 **Semgrep**: $SEMGREP_ISSUES security issues found" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 🔍 **Semgrep**: No SARIF report generated" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f safety-report.json ]; then
            SAFETY_VULNS=$(python3 -c "import json; data=json.load(open('safety-report.json')); print(len(data.get('vulnerabilities', [])))" 2>/dev/null || echo "0")
            echo "- 🛡️ **Safety**: $SAFETY_VULNS vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 🛡️ **Safety**: No report generated" >> $GITHUB_STEP_SUMMARY
          fi

  test:
    name: Test Suite
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]  # 4 pytest shards in parallel
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python with cache
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-xdist ruff

      - name: Run tests (sharded)
        run: |
          echo "🧪 Running test shard ${{ matrix.shard }} of 4"
          # Simple hash shard; replace with your own splitter if you have one
          pytest -q -n auto --maxfail=1 \
            --junitxml=report-${{ matrix.shard }}.xml \
            -k "not e2e" \
            --randomly-seed=${{ matrix.shard }} \
            --durations=15

      - name: Lint with Ruff (fast alternative)
        run: |
          echo "🔍 Running Ruff linting..."
          ruff check src/ --output-format=github || true

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-shard-${{ matrix.shard }}
          path: report-*.xml
          retention-days: 7

      - name: Test Summary
        if: always()
        run: |
          echo "### 🧪 Test Results (Shard ${{ matrix.shard }})" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Test shard ${{ matrix.shard }} completed" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 JUnit report generated" >> $GITHUB_STEP_SUMMARY

  web-test:
    name: Web Application Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python with cache
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Test web application
        run: |
          echo "🌐 Testing web application..."
          python -c "from src.web.application import app; print('Web app imports successfully')"
          echo "✅ Web application test passed"

      - name: Web Test Summary
        if: always()
        run: |
          echo "### 🌐 Web Application Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Web application imports successfully" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Web test completed" >> $GITHUB_STEP_SUMMARY

  aws-integration:
    name: AWS Integration Test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    needs: [build, test]  # gate on unit tests only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python with cache
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: gha-${{ github.run_id }}
          audience: sts.amazonaws.com

      - name: Test AWS integration
        run: |
          echo "☁️ Testing AWS integration..."
          python -c "import boto3; print('AWS SDK imports successfully')"
          echo "✅ AWS integration test passed"

      - name: AWS Test Summary
        if: always()
        run: |
          echo "### ☁️ AWS Integration Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ AWS SDK imports successfully" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ AWS integration test completed" >> $GITHUB_STEP_SUMMARY

  # —— Environment-level fan-out with reusable workflows ——
  deploy-all:
    name: Deploy to environments (parallel)
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    needs: [security, test, web-test, aws-integration]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 3  # cap if your cloud has limits
      matrix:
        include:
          - environment: ephemeral
            aws_region: us-east-1
            timeout_secs: 300
          - environment: dev
            aws_region: us-east-1
            timeout_secs: 600
          - environment: staging
            aws_region: us-east-1
            timeout_secs: 900
          - environment: prod
            aws_region: us-west-2
            timeout_secs: 1200
    steps:
      - name: Call reusable deploy
        uses: ./.github/workflows/deploy-reusable.yml
        with:
          environment: ${{ matrix.environment }}
          aws_region: ${{ matrix.aws_region }}
          timeout_secs: ${{ matrix.timeout_secs }}
        secrets: inherit

  notify:
    name: Notify Results
    if: always()
    needs: [build, security, test, web-test, aws-integration, deploy-all]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Notify Success
        if: ${{ needs.deploy-all.result == 'success' }}
        run: |
          echo "### 🎉 CI/CD Pipeline Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ All tests passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Security scans completed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Deployments successful" >> $GITHUB_STEP_SUMMARY

      - name: Notify Failure
        if: ${{ needs.deploy-all.result == 'failure' || needs.test.result == 'failure' || needs.security.result == 'failure' }}
        run: |
          echo "### ❌ CI/CD Pipeline Failed" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ Some jobs failed - check logs for details" >> $GITHUB_STEP_SUMMARY
