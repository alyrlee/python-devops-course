name: Python DevOps CI/CD Pipeline

on: 
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - staging
        - prod
      skip_tests:
        description: 'Skip tests (use with caution)'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.11'
  PIP_CACHE_DIR: ~/.cache/pip

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety semgrep
    
    - name: Run Bandit security scan
      run: |
        bandit -r src/ -f json -o bandit-report.json || true
        bandit -r src/ -ll
      continue-on-error: true
    
    - name: Check for known vulnerabilities
      run: |
        safety check --json --output safety-report.json || true
        safety check
      continue-on-error: true
    
    - name: Upload security reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    needs: security-scan
    if: ${{ !inputs.skip_tests }}
    strategy:
      matrix:
        environment: [dev, staging, prod]
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Verify pylint installation
      run: |
        pylint --version
    
    - name: Lint with pylint
      run: |
        make lint
    
    - name: Test with pytest
      run: |
        make test
    
    - name: Format check
      run: |
        make format
    
    - name: Test Results Summary
      if: always()
      run: |
        echo "🧪 Test Results Summary:"
        echo "Job Status: ${{ job.status }}"
        echo "Environment: ${{ matrix.environment }}"
        if [ "${{ job.status }}" != "success" ]; then
          echo "❌ Tests failed for ${{ matrix.environment }}"
          exit 1
        else
          echo "✅ All tests passed for ${{ matrix.environment }}"
        fi

  web-test:
    name: Web Application Test
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Test web application
      run: |
        cd src/web
        python -c "import application; print('✅ Web app imports successfully')"
    
    - name: Test Gunicorn startup
      run: |
        cd src/web
        timeout 10s gunicorn --bind 127.0.0.1:8000 --workers 1 application:app &
        sleep 5
        curl -f http://127.0.0.1:8000/api/health || exit 1
        echo "✅ Web server responds to health check"

  aws-test:
    name: AWS Integration Test
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN || secrets.AWS_ACCESS_KEY_ID }}
        role-session-name: GitHubActions-${{ github.run_id }}
        aws-region: us-east-1
    
    - name: Test AWS integration
      run: |
        make aws-test
      continue-on-error: true
    
    - name: Test Lambda deployment
      run: |
        make lambda-deploy
      continue-on-error: true
    
    - name: Test CloudWatch integration
      run: |
        make cloudwatch-info
      continue-on-error: true
    
    - name: AWS Test Results
      if: always()
      run: |
        echo "AWS integration tests completed with status: ${{ job.status }}"

  deploy:
    name: Deploy to Environments
    runs-on: ubuntu-latest
    needs: [test, web-test]
    if: github.ref == 'refs/heads/main' && (needs.aws-test.result == 'success' || needs.aws-test.result == 'skipped' || needs.aws-test.result == null)
    strategy:
      matrix:
        environment: [dev, staging, prod]
    timeout-minutes: 20
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Deploy to ${{ matrix.environment }}
      env:
        MY_SECRET: ${{ secrets.MY_SECRET || 'default-secret' }}
        ENVIRONMENT: ${{ matrix.environment }}
      run: |
        set -e
        echo "🚀 Starting deployment to ${{ matrix.environment }}"
        
        if [ "${{ matrix.environment }}" == "prod" ]; then
          echo "🔒 Production deployment - using secure secrets"
          # Production deployment commands
          echo "Deploying to Production"
        elif [ "${{ matrix.environment }}" == "staging" ]; then
          echo "🧪 Staging deployment - testing environment"
          # Staging deployment commands
          echo "Deploying to Staging"
        else
          echo "🛠️ Development deployment - experimental features"
          # Development deployment commands
          echo "Deploying to Development"
        fi
        
        echo "✅ Deployment to ${{ matrix.environment }} completed successfully"
    
    - name: Deployment Status
      if: always()
      run: |
        echo "Deployment job status: ${{ job.status }}"
        if [ "${{ job.status }}" != "success" ]; then
          echo "❌ Deployment failed for ${{ matrix.environment }}"
          exit 1
        fi

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [security-scan, test, web-test, aws-test, deploy]
    if: always()
    
    steps:
    - name: Notify Success
      if: needs.deploy.result == 'success'
      run: |
        echo "🎉 All jobs completed successfully!"
        echo "✅ Security scan: ${{ needs.security-scan.result }}"
        echo "✅ Tests: ${{ needs.test.result }}"
        echo "✅ Web tests: ${{ needs.web-test.result }}"
        echo "✅ AWS tests: ${{ needs.aws-test.result }}"
        echo "✅ Deployment: ${{ needs.deploy.result }}"
    
    - name: Notify Failure
      if: needs.deploy.result == 'failure' || needs.test.result == 'failure'
      run: |
        echo "❌ Pipeline failed!"
        echo "Security scan: ${{ needs.security-scan.result }}"
        echo "Tests: ${{ needs.test.result }}"
        echo "Web tests: ${{ needs.web-test.result }}"
        echo "AWS tests: ${{ needs.aws-test.result }}"
        echo "Deployment: ${{ needs.deploy.result }}"
        exit 1  