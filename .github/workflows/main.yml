name: Python DevOps CI/CD Pipeline

on: 
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Verify pylint installation
      run: |
        pylint --version
    
    - name: Lint with pylint
      run: |
        make lint
    
    - name: Test with pytest
      run: |
        make test
    
    - name: Format check
      run: |
        make format

  web-test:
    name: Web Application Test
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Test web application
      run: |
        cd src/web
        python -c "import application; print('✅ Web app imports successfully')"
    
    - name: Test Gunicorn startup
      run: |
        cd src/web
        timeout 10s gunicorn --bind 127.0.0.1:8000 --workers 1 application:app &
        sleep 5
        curl -f http://127.0.0.1:8000/api/health || exit 1
        echo "✅ Web server responds to health check"

  aws-test:
    name: AWS Integration Test
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    
    - name: Test AWS integration
      run: |
        make aws-test
    
    - name: Test Lambda deployment
      run: |
        make lambda-deploy
    
    - name: Test CloudWatch integration
      run: |
        make cloudwatch-info
    