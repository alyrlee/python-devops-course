---
name: Deploy to Production

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write
  id-token: write          # for AWS OIDC
  # everything else defaults to none

defaults:
  run:
    shell: bash -euo pipefail

# Required Secrets:
# - AWS_ROLE_ARN: The ARN of the AWS IAM role to assume for deployment
#   Example: arn:aws:iam::123456789012:role/GitHubActionsRole
#   Configure in: Repository Settings > Secrets and variables > Actions

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python with cache
        uses: ./.github/actions/python-setup

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: us-east-1

      - name: Deploy Lambda function
        run: |
          make lambda-deploy

      - name: Test Lambda deployment
        run: |
          make lambda-test

      - name: Verify CloudWatch integration
        run: |
          make cloudwatch-info

      - name: Create deployment package
        run: |
          cd src/web
          zip -r ../../lambda_packages/web-app.zip .

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v3
        with:
          name: deployment-package
          path: |
            lambda_packages/
            scripts/
          retention-days: 30
