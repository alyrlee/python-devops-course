---
name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      timeout_secs:
        required: false
        type: number
        default: 600
    secrets:
      AWS_ROLE_ARN:
        required: true

# Per-environment concurrency: Serialize deployments to prevent stampeding
concurrency:
  group: deploy-${{ inputs.environment }}-${{ github.ref }}
  cancel-in-progress: false  # serialize per env if multiple callers race

permissions:
  contents: read
  id-token: write
  deployments: write

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.timeout_secs || 600) / 60 }}
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.expose.outputs.env_url || '' }}  # shows on Env page
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Verify artifacts
        run: |
          echo "📦 Verifying downloaded artifacts for ${{ inputs.environment }}..."
          ls -la dist/ || echo "No dist directory found"
          if [ -d "dist" ]; then
            echo "✅ Artifacts downloaded successfully"
            find dist -type f -name "*.whl" -o -name "*.tar.gz" | head -5
          else
            echo "⚠️ No artifacts found, proceeding with source deployment"
          fi

      - name: Setup Python with cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: gha-${{ github.run_id }}
          audience: sts.amazonaws.com

      - name: Deploy to ${{ inputs.environment }}
        id: deploy
        run: |
          echo "🚀 Deploying to ${{ inputs.environment }} environment"
          echo "📍 AWS Region: ${{ inputs.aws_region }}"
          echo "⏱️ Timeout: ${{ inputs.timeout_secs }} seconds"
          
          # Simulate deployment based on environment
          case "${{ inputs.environment }}" in
            "ephemeral")
              echo "🔄 Deploying ephemeral environment (quick deployment)"
              python -c "print('Ephemeral deployment: Basic infrastructure')"
              ;;
            "dev")
              echo "🛠️ Deploying development environment (feature deployment)"
              python -c "print('Dev deployment: All features enabled')"
              ;;
            "staging")
              echo "🧪 Deploying staging environment (integration deployment)"
              python -c "print('Staging deployment: Production-like setup')"
              ;;
            "prod")
              echo "🔒 Deploying production environment (critical deployment)"
              python -c "print('Production deployment: High availability setup')"
              ;;
          esac
          
          # Set deployment URL based on environment
          echo "env_url=https://${{ inputs.environment }}.example.com" >> "$GITHUB_OUTPUT"
          echo "✅ Deployment to ${{ inputs.environment }} completed"

      - name: Post Deploy Phase Status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const environment = '${{ inputs.environment }}';
            const deployStatus = '${{ steps.deploy.outcome }}' === 'success' ? 'success' : 'failure';
            
            // Post deployment phase status
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: context.payload.deployment?.id || 0,
              state: deployStatus,
              environment: environment,
              description: `Deploy phase ${deployStatus} for ${environment}`,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            
            console.log(`Posted deploy phase ${deployStatus} for ${environment}`);

      - name: Expose URL
        id: expose
        run: |
          echo "env_url=${{ steps.deploy.outputs.env_url }}" >> "$GITHUB_OUTPUT"
          echo "🔗 Environment URL: ${{ steps.deploy.outputs.env_url }}"

      - name: Post-deploy checks
        id: post-deploy
        uses: ./.github/actions/post-deploy-checks
        with:
          environment: ${{ inputs.environment }}

      - name: Post Deploy Checks Status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const environment = '${{ inputs.environment }}';
            const checksStatus = '${{ steps.post-deploy.outcome }}' === 'success' ? 'success' : 'failure';
            
            // Post checks phase status
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: context.payload.deployment?.id || 0,
              state: checksStatus,
              environment: environment,
              description: `Post-deploy checks ${checksStatus} for ${environment}`,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            
            console.log(`Posted post-deploy checks ${checksStatus} for ${environment}`);

      - name: Environment Dashboard Summary
        if: always()
        run: |
          {
            echo "### ${ENVIRONMENT^} Deployment Dashboard"
            echo "- **Status**: ${{ job.status }}"
            echo "- **Region**: ${{ inputs.aws_region }}"
            echo "- **URL**: ${{ steps.expose.outputs.env_url || 'n/a' }}"
            echo "- **Timeout**: ${{ inputs.timeout_secs }}s"
            echo "- **Deployment ID**: ${{ github.run_id }}"
            echo "- **Triggered by**: ${{ github.actor }}"
            echo "- **Branch**: ${{ github.ref_name }}"
            echo "- **Commit**: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          ENVIRONMENT: ${{ inputs.environment }}

      - name: Post Deployment Status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const environment = '${{ inputs.environment }}';
            const status = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            const url = '${{ steps.expose.outputs.env_url || '' }}';
            
            // Create deployment status
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: context.payload.deployment?.id || 0,
              state: status,
              environment: environment,
              environment_url: url || undefined,
              description: `${environment} deployment ${status}`,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            
            console.log(`Posted ${status} status for ${environment} deployment`);
