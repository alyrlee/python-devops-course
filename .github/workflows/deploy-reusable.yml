---
name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      timeout_secs:
        required: false
        type: number
        default: 600
    secrets: {}

# Per-environment concurrency: Serialize deployments to prevent stampeding
concurrency:
  group: deploy-${{ inputs.environment }}-${{ github.ref }}
  cancel-in-progress: false  # serialize per env if multiple callers race

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.expose.outputs.env_url || '' }}  # shows on Env page
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Verify artifacts
        run: |
          echo "📦 Verifying downloaded artifacts for ${{ inputs.environment }}..."
          ls -la dist/ || echo "No dist directory found"
          if [ -d "dist" ]; then
            echo "✅ Artifacts downloaded successfully"
            find dist -type f -name "*.whl" -o -name "*.tar.gz" | head -5
          else
            echo "⚠️ No artifacts found, proceeding with source deployment"
          fi

      - name: Setup Python with cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Verify AWS region configuration
        run: |
          echo "🌍 AWS Region: ${{ inputs.aws_region }}"
          echo "🔧 Environment: ${{ inputs.environment }}"
          echo "⏱️ Timeout: ${{ inputs.timeout_secs }} seconds"
          echo "✅ Deployment configuration verified (demo mode)"

      - name: Deploy to ${{ inputs.environment }}
        id: deploy
        run: |
          echo "🚀 Deploying to ${{ inputs.environment }} environment"
          echo "📍 AWS Region: ${{ inputs.aws_region }}"
          echo "⏱️ Timeout: ${{ inputs.timeout_secs }} seconds"
          
          # Simulate deployment based on environment
          case "${{ inputs.environment }}" in
            "ephemeral")
              echo "🔄 Deploying ephemeral environment (quick deployment)"
              python -c "print('Ephemeral deployment: Basic infrastructure')"
              ;;
            "dev")
              echo "🛠️ Deploying development environment (feature deployment)"
              python -c "print('Dev deployment: All features enabled')"
              ;;
            "staging")
              echo "🧪 Deploying staging environment (integration deployment)"
              python -c "print('Staging deployment: Production-like setup')"
              ;;
            "prod")
              echo "🔒 Deploying production environment (critical deployment)"
              python -c "print('Production deployment: High availability setup')"
              ;;
          esac
          
          # Set deployment URL based on environment
          echo "env_url=http://localhost:5001/environments/${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          echo "✅ Deployment to ${{ inputs.environment }} completed"

      - name: Post Deploy Phase Status
        if: always()
        run: |
          echo "📊 Deploy phase status: ${{ steps.deploy.outcome }}"
          echo "🌍 Environment: ${{ inputs.environment }}"
          echo "✅ Deployment phase completed (demo mode)"

      - name: Expose URL
        id: expose
        run: |
          echo "env_url=${{ steps.deploy.outputs.env_url }}" >> "$GITHUB_OUTPUT"
          echo "🔗 Environment URL: ${{ steps.deploy.outputs.env_url }}"

      - name: Post-deploy checks
        id: post-deploy
        uses: ./.github/actions/post-deploy-checks
        with:
          environment: ${{ inputs.environment }}

      - name: Post Deploy Checks Status
        if: always()
        run: |
          echo "📊 Post-deploy checks status: ${{ steps.post-deploy.outcome }}"
          echo "🌍 Environment: ${{ inputs.environment }}"
          echo "✅ Post-deploy checks completed (demo mode)"

      - name: Environment Dashboard Summary
        if: always()
        run: |
          {
            echo "### ${ENVIRONMENT^} Deployment Dashboard"
            echo "- **Status**: ${{ job.status }}"
            echo "- **Region**: ${{ inputs.aws_region }}"
            echo "- **URL**: ${{ steps.expose.outputs.env_url || 'n/a' }}"
            echo "- **Timeout**: ${{ inputs.timeout_secs }}s"
            echo "- **Deployment ID**: ${{ github.run_id }}"
            echo "- **Triggered by**: ${{ github.actor }}"
            echo "- **Branch**: ${{ github.ref_name }}"
            echo "- **Commit**: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          ENVIRONMENT: ${{ inputs.environment }}

      - name: Post Deployment Status
        if: always()
        run: |
          echo "📊 Final deployment status: ${{ job.status }}"
          echo "🌍 Environment: ${{ inputs.environment }}"
          echo "🔗 Environment URL: ${{ steps.expose.outputs.env_url || 'N/A' }}"
          echo "✅ Deployment status completed (demo mode)"
