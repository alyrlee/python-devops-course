---
name: Ship (orchestrator)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      skip_tests:
        description: 'Skip tests (use with caution)'
        required: false
        default: false
        type: boolean

# Global concurrency: Cancel superseded pushes to prevent resource waste
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  security-events: write
  checks: write
  actions: read

env:
  PYTHON_VERSION: "3.11"
  PIP_CACHE_DIR: ~/.cache/pip

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python with cache
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build package
        run: |
          echo "🔨 Building package artifacts..."
          python -m build
          echo "✅ Package build completed"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 7

      - name: Build Summary
        if: always()
        run: |
          echo "### 🔨 Build Results" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Package artifacts built successfully" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 Artifacts uploaded for deployment" >> $GITHUB_STEP_SUMMARY

  # —— Ephemeral deployment (first) ——
  deploy-ephemeral:
    needs: build
    permissions:
      contents: read
      id-token: write
      deployments: write
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: ephemeral
      aws_region: us-east-1
      timeout_secs: 300
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

  # —— Dev deployment (after ephemeral) ——
  deploy-dev:
    needs: deploy-ephemeral
    permissions:
      contents: read
      id-token: write
      deployments: write
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: dev
      aws_region: us-east-1
      timeout_secs: 600
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

  # —— Staging deployment (sequential) ——
  deploy-staging:
    needs: deploy-dev
    permissions:
      contents: read
      id-token: write
      deployments: write
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: staging
      aws_region: us-east-1
      timeout_secs: 900
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

  # —— Production deployment (sequential with protection) ——
  deploy-prod:
    needs: deploy-staging
    permissions:
      contents: read
      id-token: write
      deployments: write
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: prod
      aws_region: us-west-2
      timeout_secs: 1200
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

  # —— Deployment Summary ——
  notify:
    if: always()
    needs: [build, deploy-ephemeral, deploy-dev, deploy-staging, deploy-prod]
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Summary
        run: |
          {
            echo "### 🚀 Ship Summary"
            echo "- **Build**: ${{ needs.build.result }}"
            echo "- **Ephemeral**: ${{ needs.deploy-ephemeral.result }}"
            echo "- **Dev**: ${{ needs.deploy-dev.result }}"
            echo "- **Staging**: ${{ needs.deploy-staging.result }}"
            echo "- **Production**: ${{ needs.deploy-prod.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
