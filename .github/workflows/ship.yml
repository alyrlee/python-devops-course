---
name: Ship (orchestrator)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      skip_tests:
        description: 'Skip tests (use with caution)'
        required: false
        default: false
        type: boolean

# Global concurrency: Cancel superseded pushes to prevent resource waste
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  security-events: write
  checks: write
  actions: read

env:
  PYTHON_VERSION: "3.11"
  PIP_CACHE_DIR: ~/.cache/pip

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python with cache
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build package
        run: |
          echo "🔨 Building package artifacts..."
          python -m build
          echo "✅ Package build completed"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 7

      - name: Build Summary
        if: always()
        run: |
          echo "### 🔨 Build Results" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Package artifacts built successfully" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 Artifacts uploaded for deployment" >> $GITHUB_STEP_SUMMARY

  # —— Early environments (parallel deployment) ——
  deploy-early:
    name: Deploy Early Environments
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [ephemeral, dev]
    steps:
      - name: Deploy to ${{ matrix.environment }}
        uses: ./.github/workflows/deploy-reusable.yml
        with:
          environment: ${{ matrix.environment }}
          aws_region: us-east-1
          timeout_secs: ${{ matrix.environment == 'ephemeral' && 300 || 600 }}
        secrets: inherit

  # —— Staging deployment (sequential) ——
  deploy-staging:
    name: Deploy to Staging
    needs: deploy-early
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to staging
        uses: ./.github/workflows/deploy-reusable.yml
        with:
          environment: staging
          aws_region: us-east-1
          timeout_secs: 900
        secrets: inherit

  # —— Production deployment (sequential with protection) ——
  deploy-prod:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production
        uses: ./.github/workflows/deploy-reusable.yml
        with:
          environment: prod
          aws_region: us-west-2
          timeout_secs: 1200
        secrets: inherit

  # —— Deployment Summary ——
  notify:
    name: Deployment Summary
    if: always()
    needs: [build, deploy-early, deploy-staging, deploy-prod]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Deployment Summary
        if: always()
        run: |
          echo "### 🚀 Deployment Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Status | Region | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|--------|--------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| **ephemeral** | ${{ needs.deploy-early.result == 'success' && '✅ Success' || '❌ Failed' }} | us-east-1 | https://ephemeral.example.com |" >> $GITHUB_STEP_SUMMARY
          echo "| **dev** | ${{ needs.deploy-early.result == 'success' && '✅ Success' || '❌ Failed' }} | us-east-1 | https://dev.example.com |" >> $GITHUB_STEP_SUMMARY
          echo "| **staging** | ${{ needs.deploy-staging.result == 'success' && '✅ Success' || '❌ Failed' }} | us-east-1 | https://staging.example.com |" >> $GITHUB_STEP_SUMMARY
          echo "| **prod** | ${{ needs.deploy-prod.result == 'success' && '✅ Success' || '❌ Failed' }} | us-west-2 | https://prod.example.com |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Build**: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Early Deployments**: ${{ needs.deploy-early.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Staging Deployment**: ${{ needs.deploy-staging.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Production Deployment**: ${{ needs.deploy-prod.result }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify Success
        if: ${{ needs.deploy-prod.result == 'success' }}
        run: |
          echo "### 🎉 Deployment Pipeline Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ All environments deployed successfully" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Production deployment completed" >> $GITHUB_STEP_SUMMARY

      - name: Notify Failure
        if: ${{ needs.deploy-prod.result == 'failure' || needs.deploy-staging.result == 'failure' || needs.deploy-early.result == 'failure' }}
        run: |
          echo "### ❌ Deployment Pipeline Failed" >> $GITHUB_STEP_SUMMARY
          echo "- ❌ Some deployments failed - check logs for details" >> $GITHUB_STEP_SUMMARY
          echo "- 🔍 Check individual environment status above" >> $GITHUB_STEP_SUMMARY
