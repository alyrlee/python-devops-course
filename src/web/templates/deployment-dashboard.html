<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deployment Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .dashboard {
            padding: 30px;
        }

        .environments {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .environment-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            border-left: 4px solid #ddd;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .environment-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .environment-card.success {
            border-left-color: #27ae60;
            background: linear-gradient(135deg, #d5f4e6 0%, #a8e6cf 100%);
        }

        .environment-card.failure {
            border-left-color: #e74c3c;
            background: linear-gradient(135deg, #fadbd8 0%, #f1948a 100%);
        }

        .environment-card.pending {
            border-left-color: #f39c12;
            background: linear-gradient(135deg, #fef9e7 0%, #f7dc6f 100%);
        }

        .environment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .environment-name {
            font-size: 1.3rem;
            font-weight: 600;
            text-transform: capitalize;
            color: #2c3e50;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-badge.success {
            background: #27ae60;
            color: white;
        }

        .status-badge.failure {
            background: #e74c3c;
            color: white;
        }

        .status-badge.pending {
            background: #f39c12;
            color: white;
        }

        .environment-details {
            margin-bottom: 15px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .detail-label {
            color: #7f8c8d;
            font-weight: 500;
        }

        .detail-value {
            color: #2c3e50;
            font-weight: 600;
        }

        .environment-url {
            display: inline-block;
            background: #3498db;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.3s ease;
        }

        .environment-url:hover {
            background: #2980b9;
        }

        .summary {
            background: #ecf0f1;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .summary h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .stat {
            text-align: center;
            padding: 15px;
            background: white;
            border-radius: 6px;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #7f8c8d;
            font-size: 0.9rem;
        }

        .success .stat-number { color: #27ae60; }
        .failure .stat-number { color: #e74c3c; }
        .pending .stat-number { color: #f39c12; }

        .refresh-btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 20px;
            transition: background 0.3s ease;
        }

        .refresh-btn:hover {
            background: #2980b9;
        }

        .last-updated {
            text-align: center;
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .environments {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Deployment Dashboard</h1>
            <p>Real-time deployment status for all environments</p>
        </div>
        
        <div class="dashboard">
            <div class="environments" id="environments">
                <!-- Environment cards will be populated by JavaScript -->
            </div>
            
            <div class="summary">
                <h3>📊 Deployment Summary</h3>
                <div class="summary-stats">
                    <div class="stat success">
                        <div class="stat-number" id="success-count">0</div>
                        <div class="stat-label">Successful</div>
                    </div>
                    <div class="stat failure">
                        <div class="stat-number" id="failure-count">0</div>
                        <div class="stat-label">Failed</div>
                    </div>
                    <div class="stat pending">
                        <div class="stat-number" id="pending-count">0</div>
                        <div class="stat-label">Pending</div>
                    </div>
                </div>
            </div>
            
            <div style="text-align: center;">
                <button class="refresh-btn" onclick="refreshStatus()">🔄 Refresh Status</button>
            </div>
            
            <div class="last-updated">
                Last updated: <span id="last-updated"></span>
            </div>
        </div>
    </div>

    <script>
        let deploymentData = {};

        function renderEnvironments() {
            const container = document.getElementById('environments');
            container.innerHTML = '';

            Object.entries(deploymentData).forEach(([key, env]) => {
                const card = document.createElement('div');
                card.className = `environment-card ${env.status}`;
                
                card.innerHTML = `
                    <div class="environment-header">
                        <div class="environment-name">${env.name}</div>
                        <div class="status-badge ${env.status}">${env.status}</div>
                    </div>
                    <div class="environment-details">
                        <div class="detail-row">
                            <span class="detail-label">Region:</span>
                            <span class="detail-value">${env.region}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Last Deployed:</span>
                            <span class="detail-value">${env.lastDeployed}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Duration:</span>
                            <span class="detail-value">${env.duration}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Commit:</span>
                            <span class="detail-value">${env.commit}</span>
                        </div>
                    </div>
                    <a href="${env.url}" class="environment-url" target="_blank" onclick="handleEnvironmentClick(event, '${env.name}')">
                        🌐 Visit Environment
                    </a>
                `;
                
                container.appendChild(card);
            });
        }

        function updateSummary() {
            const stats = Object.values(deploymentData).reduce((acc, env) => {
                acc[env.status] = (acc[env.status] || 0) + 1;
                return acc;
            }, {});

            document.getElementById('success-count').textContent = stats.success || 0;
            document.getElementById('failure-count').textContent = stats.failure || 0;
            document.getElementById('pending-count').textContent = stats.pending || 0;
        }

        async function fetchDeploymentData() {
            try {
                const response = await fetch('/api/deployments');
                if (!response.ok) {
                    throw new Error('Failed to fetch deployment data');
                }
                deploymentData = await response.json();
                renderEnvironments();
                updateSummary();
            } catch (error) {
                console.error('Error fetching deployment data:', error);
                // Fallback to sample data
                deploymentData = {
                    ephemeral: { name: 'Ephemeral', status: 'success', region: 'us-east-1', url: 'https://ephemeral.example.com', lastDeployed: '2024-01-15 14:30:00', duration: '2m 15s', commit: 'abc1234' },
                    dev: { name: 'Development', status: 'success', region: 'us-east-1', url: 'https://dev.example.com', lastDeployed: '2024-01-15 14:25:00', duration: '3m 45s', commit: 'def5678' },
                    staging: { name: 'Staging', status: 'pending', region: 'us-east-1', url: 'https://staging.example.com', lastDeployed: '2024-01-15 14:20:00', duration: '4m 30s', commit: 'ghi9012' },
                    prod: { name: 'Production', status: 'failure', region: 'us-west-2', url: 'https://prod.example.com', lastDeployed: '2024-01-15 14:15:00', duration: '5m 10s', commit: 'jkl3456' }
                };
                renderEnvironments();
                updateSummary();
            }
        }

        function refreshStatus() {
            const btn = document.querySelector('.refresh-btn');
            btn.textContent = '🔄 Refreshing...';
            btn.disabled = true;

            fetchDeploymentData().then(() => {
                document.getElementById('last-updated').textContent = new Date().toLocaleString();
                btn.textContent = '🔄 Refresh Status';
                btn.disabled = false;
            }).catch(() => {
                btn.textContent = '🔄 Refresh Status';
                btn.disabled = false;
            });
        }

        function handleEnvironmentClick(event, environmentName) {
            // Add a small delay to show user feedback
            const link = event.target;
            const originalText = link.textContent;
            link.textContent = '🔄 Loading...';
            link.style.pointerEvents = 'none';
            
            // Reset after a short delay
            setTimeout(() => {
                link.textContent = originalText;
                link.style.pointerEvents = 'auto';
            }, 1000);
        }

        // Initialize the dashboard
        document.addEventListener('DOMContentLoaded', function() {
            fetchDeploymentData();
            document.getElementById('last-updated').textContent = new Date().toLocaleString();
        });
    </script>
</body>
</html>
